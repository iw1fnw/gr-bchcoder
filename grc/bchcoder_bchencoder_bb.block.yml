id: bchcoder_bchencoder_bb
label: bchencoder bb
category: '[Bchcoder]'
templates:
  imports: from gnuradio import bchcoder
  make: bchcoder.bchencoder_bb(${length}, ${k}, ${t})
parameters:
- id: length
  label: Length
  dtype: int
- id: k
  label: K
  dtype: int
- id: t
  label: T
  dtype: int
inputs:
- label: in
  domain: stream
  dtype: byte
outputs:
- label: out
  domain: stream
  dtype: byte
documentation: |-
  input: the input is a stream of bytes with values between 1 and 0 that represents a string of bits

file_format: 1
